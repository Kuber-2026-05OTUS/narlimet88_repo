deploymentMode: SingleBinary

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 1Gi
    storageClass: standard

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

minio:
  enabled: true

  image:
    repository: minio/minio
    tag: RELEASE.2023-09-30T07-02-29Z
    pullPolicy: IfNotPresent

  mcImage:
    repository: minio/mc
    tag: RELEASE.2023-09-29T16-41-22Z
    pullPolicy: IfNotPresent

  persistence:
    size: 1Gi

chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

gateway:
  enabled: true

test:
  enabled: false
