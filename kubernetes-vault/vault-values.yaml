global:
  enabled: true
  tlsDisable: true

injector:
  enabled: false

server:
  enabled: true

  affinity: ""

  dataStorage:
    enabled: false

  auditStorage:
    enabled: false

  ha:
    enabled: true
    replicas: 3

    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "consul" {
        address = "consul-server.consul.svc.cluster.local:8500"
        path    = "vault/"
      }

      service_registration "kubernetes" {}

ui:
  enabled: false
