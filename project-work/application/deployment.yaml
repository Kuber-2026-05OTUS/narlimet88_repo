apiVersion: apps/v1
kind: Deployment
metadata:
  name: diploma-app
  namespace: diploma
spec:
  replicas: 2
  selector:
    matchLabels:
      app: diploma-app
  template:
    metadata:
      labels:
        app: diploma-app
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.4.2
          args:
            - --nginx.scrape-uri=http://127.0.0.1:80/stub_status
          ports:
            - name: metrics
              containerPort: 9113

      volumes:
        - name: nginx-config
          configMap:
            name: diploma-nginx-config
