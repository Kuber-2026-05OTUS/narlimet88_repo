apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: diploma-route
  namespace: diploma
spec:
  parentRefs:
    - name: diploma-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: diploma-app
          port: 80
