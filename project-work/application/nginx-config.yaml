apiVersion: v1
kind: ConfigMap
metadata:
  name: diploma-nginx-config
  namespace: diploma
data:
  default.conf: |
    server {
        listen 80;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location = /stub_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
