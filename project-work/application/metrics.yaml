apiVersion: v1
kind: Service
metadata:
  name: diploma-app-metrics
  namespace: diploma
  labels:
    app: diploma-app-metrics
spec:
  selector:
    app: diploma-app
  ports:
    - name: metrics
      port: 9113
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: diploma-app
  namespace: diploma
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: diploma-app-metrics
  namespaceSelector:
    matchNames:
      - diploma
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
