---
- name: Install Kubernetes components
  hosts: k8s_cluster
  become: true
  gather_facts: true
  vars_files:
    - versions.yaml

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes repository key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-release.key
        mode: '0644'

    - name: Convert Kubernetes repository key to GPG
      ansible.builtin.command:
        cmd: gpg --dearmor --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /etc/apt/keyrings/kubernetes-release.key
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Configure Kubernetes APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_repo_version }}/deb/ /"
        filename: kubernetes
        state: present
        update_cache: true

    - name: Install containerd
      ansible.builtin.apt:
        name: "containerd={{ containerd_version }}"
        state: present

    - name: Install Kubernetes packages
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_version }}"
          - "kubeadm={{ kubernetes_version }}"
          - "kubectl={{ kubernetes_version }}"
        state: present

    - name: Enable containerd
      ansible.builtin.systemd_service:
        name: containerd
        enabled: true

    - name: Enable kubelet
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
