---
- name: Install Flannel CNI
  hosts: control_plane
  become: true
  gather_facts: false

  tasks:
    - name: Copy Flannel manifest
      ansible.builtin.copy:
        src: files/flannel.json
        dest: /tmp/flannel.json
        owner: root
        group: root
        mode: '0644'

    - name: Apply Flannel manifest
      ansible.builtin.command:
        cmd: kubectl --kubeconfig=/etc/kubernetes/admin.conf apply -f /tmp/flannel.json
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"
