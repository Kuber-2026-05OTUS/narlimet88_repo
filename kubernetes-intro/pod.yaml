apiVersion: v1
kind: Pod
metadata:
  name: homework
  namespace: homework

spec:
  initContainers:
    - name: init
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo '<html><body><h1>Hello from Kubernetes homework!</h1></body></html>' > /init/index.html
      volumeMounts:
        - name: shared-data
          mountPath: /init

  containers:
    - name: web
      image: python:3.12-alpine
      command:
        - python
        - -m
        - http.server
        - "8000"
        - --directory
        - /homework

      ports:
        - containerPort: 8000

      volumeMounts:
        - name: shared-data
          mountPath: /homework

      lifecycle:
        preStop:
          exec:
            command:
              - sh
              - -c
              - rm -f /homework/index.html

  volumes:
    - name: shared-data
      emptyDir: {}
