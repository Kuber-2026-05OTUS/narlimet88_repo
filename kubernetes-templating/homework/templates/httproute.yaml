{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "homework.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "homework.labels" . | nindent 4 }}

spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}

  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}

  rules:
    - matches:
        - path:
            type: Exact
            value: {{ .Values.httpRoute.homepagePath }}

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .Values.httpRoute.rewritePath }}

      backendRefs:
        - name: {{ include "homework.fullname" . }}
          port: {{ .Values.service.port }}

    - backendRefs:
        - name: {{ include "homework.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
